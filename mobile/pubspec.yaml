name: reserva_instalaciones
description: App de reservas de instalaciones deportivas municipales
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
